.code,.codeb{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;font-size:12px}.codeb{font-weight:700}
.title{font-size:15px;font-weight:700}.small{font-size:11.5px}.smallb{font-size:11.5px;font-weight:700}.tiny{font-size:9.5px;fill:var(--muted)}
.lane{font-size:10px;font-weight:700;letter-spacing:.08em;fill:var(--muted)}.chip{font-size:11.5px;font-weight:700}
.bg{fill:var(--bg)}.muted{fill:var(--muted)}.faint{fill:var(--faint)}
.card{fill:var(--card)}.rule{stroke:var(--line);stroke-width:1;fill:none}.band{fill:var(--band)}
.tint.new{fill:var(--new-bg)}.tint.changed{fill:var(--chg-bg)}.tint.removed{fill:var(--del-bg)}
.bar.new{fill:var(--new)}.bar.changed{fill:var(--chg)}.bar.removed{fill:var(--del)}.bar.unchanged{fill:var(--edge)}
.t-new{fill:var(--new-fg)}.t-changed{fill:var(--chg-fg)}.t-removed{fill:var(--del-fg)}.t-rk{fill:var(--risk)}
