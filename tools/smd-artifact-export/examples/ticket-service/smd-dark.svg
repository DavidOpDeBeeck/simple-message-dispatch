<style>svg{--bg:#121214;--fg:#ececef;--muted:#a1a1aa;--faint:#6b6b74;--line:#2a2a30;--card:#1a1a1e;--edge:#46464e;--band:#232327;--new:#4ade80;--new-bg:#12341f;--new-fg:#bbf7d0;--chg:#fbbf24;--chg-bg:#3a2c0f;--chg-fg:#fde68a;--del:#f87171;--del-bg:#3b1515;--del-fg:#fecaca;--risk:#fb7185;--risk-fg:#1a0a0e}
