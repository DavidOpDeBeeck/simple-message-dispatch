// Adds the exportSmdArtifact task to one project of an SMD application, without the application declaring anything.
// extract-smd.sh passes these properties:
//
//   smdExport.sources     the exporter's Java sources (this folder's src/)
//   smdExport.mainClass   the application's @SpringBootApplication class
//   smdExport.out         the file to write the Artifact to
//   smdExport.project     the project path of the application (default ':')
//   smdExport.sourceSet   the source set whose runtime classpath boots it (default 'test')
//   smdExport.app         the Artifact's app name (default spring.application.name)
//   smdExport.configClasses  extra configuration classes to boot with, one per line (what a test would @Import)
//   smdExport.properties  Spring properties for the boot, one key=value per line

// buildSrc and included builds are builds of their own; the task belongs in the build that was started.
if (gradle.parent == null) {
    def required = { String name ->
        def value = gradle.startParameter.projectProperties[name]
        if (!value) {
            throw new GradleException("smd-artifact-export: -P${name} is required")
        }
        value
    }
    def optional = { String name, String fallback -> gradle.startParameter.projectProperties[name] ?: fallback }

    def targetPath = optional('smdExport.project', ':')
    def found = false

    allprojects { project ->
        if (project.path != targetPath) {
            return
        }
        found = true
        project.afterEvaluate {
            def sourceSets = project.extensions.findByType(SourceSetContainer)
            if (sourceSets == null) {
                throw new GradleException("smd-artifact-export: project '${targetPath}' has no Java source sets")
            }
            def sourceSetName = optional('smdExport.sourceSet', 'test')
            def sourceSet = sourceSets.findByName(sourceSetName)
            if (sourceSet == null) {
                throw new GradleException("smd-artifact-export: project '${targetPath}' has no source set '${sourceSetName}'; it has ${sourceSets*.name}")
            }
            def classesDir = project.layout.buildDirectory.dir('smd-artifact-export/classes')

            def compile = project.tasks.register('compileSmdArtifactExport', JavaCompile) {
                source = project.fileTree(required('smdExport.sources')) { include '**/*.java' }
                classpath = sourceSet.runtimeClasspath
                destinationDirectory.set(classesDir)
                options.encoding = 'UTF-8'
            }

            project.tasks.register('exportSmdArtifact', JavaExec) {
                dependsOn compile
                classpath = project.files(classesDir) + sourceSet.runtimeClasspath
                mainClass.set('app.dodb.smd.artifactexport.SmdArtifactExport')
                workingDir = project.projectDir
                def arguments = ['--main-class', required('smdExport.mainClass'), '--out', required('smdExport.out')]
                def app = optional('smdExport.app', null)
                if (app) {
                    arguments += ['--app', app]
                }
                optional('smdExport.configClasses', '').readLines().findAll { it.trim() }.each { arguments += ['--config-class', it.trim()] }
                optional('smdExport.properties', '').readLines().findAll { it.trim() }.each { arguments += ['--property', it.trim()] }
                args(arguments)
            }
        }
    }

    gradle.projectsEvaluated {
        if (!found) {
            throw new GradleException("smd-artifact-export: no project '${targetPath}' in this build")
        }
    }
}
