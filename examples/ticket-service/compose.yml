services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: tickets
      POSTGRES_USER: tickets
      POSTGRES_PASSWORD: tickets
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U tickets -d tickets" ]
      interval: 2s
      timeout: 2s
      retries: 15
